<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000" width="750" height="1000">
  <defs>
    <!-- Style definitions -->
    <style>
      .bg-paper { fill: #FAFAF7; }
      .ink-cobalt { fill: #2148B8; }
      .ink-terracotta { fill: #C65F38; }
      .stroke-cobalt { stroke: #2148B8; }
      .stroke-terracotta { stroke: #C65F38; }
      
      .font-display {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Arial Black", Arial, sans-serif;
        font-weight: 900;
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .font-serif {
        font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      }
    </style>

    <!-- Halftone Pattern 1: Light Dots (Ghost 1) -->
    <pattern id="halftone-light" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.5" fill="#2148B8" fill-opacity="0.32"/>
    </pattern>

    <!-- Halftone Pattern 2: Medium Dots (Ghost 2) -->
    <pattern id="halftone-med" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.2" fill="#2148B8" fill-opacity="0.5"/>
    </pattern>

    <!-- Halftone Pattern 3: Dense Screen (Ghost 3 & Shading) -->
    <pattern id="halftone-dense" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.8" fill="#2148B8" fill-opacity="0.75"/>
    </pattern>

    <!-- Fine Grid Background Pattern -->
    <pattern id="micro-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2148B8" stroke-width="0.35" stroke-opacity="0.10"/>
    </pattern>

    <!-- Vector Markers -->
    <marker id="arrow-terra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#C65F38"/>
    </marker>
    <marker id="arrow-cobalt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2148B8"/>
    </marker>
  </defs>

  <!-- ================= 1. SUBSTRATE ================= -->
  <rect width="750" height="1000" class="bg-paper"/>
  
  <!-- Subtle Micro Grid Texture on Canvas -->
  <rect x="45" y="45" width="660" height="910" fill="url(#micro-grid)"/>

  <!-- ================= 2. STRUCTURAL FRAMES & MARGINS ================= -->
  <!-- Outer Margin Border (45px margin) -->
  <rect x="45" y="45" width="660" height="910" fill="none" stroke="#2148B8" stroke-width="1.2" stroke-opacity="0.85"/>
  <rect x="49" y="49" width="652" height="902" fill="none" stroke="#2148B8" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Registration Marks (Corners) with 0.8mm Analog Print Drift -->
  <!-- Top-Left Registration Mark -->
  <g transform="translate(26, 26)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#2148B8" stroke-width="0.8"/>
    <circle cx="1" cy="0.8" r="9" fill="none" stroke="#C65F38" stroke-width="0.5" stroke-opacity="0.7"/>
  </g>
  <!-- Top-Right Registration Mark -->
  <g transform="translate(724, 26)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#2148B8" stroke-width="0.8"/>
  </g>
  <!-- Bottom-Left Registration Mark -->
  <g transform="translate(26, 974)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#2148B8" stroke-width="0.8"/>
  </g>
  <!-- Bottom-Right Registration Mark -->
  <g transform="translate(724, 974)">
    <circle cx="0" cy="0" r="9" fill="none" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="-13" y1="0" x2="13" y2="0" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#2148B8" stroke-width="0.8"/>
    <line x1="-12" y1="1" x2="14" y2="1" stroke="#C65F38" stroke-width="0.6" stroke-opacity="0.8"/>
    <line x1="1" y1="-12" x2="1" y2="14" stroke="#C65F38" stroke-width="0.6" stroke-opacity="0.8"/>
  </g>

  <!-- Major Geometric Grid Lines -->
  <line x1="45" y1="120" x2="705" y2="120" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="45" y1="410" x2="705" y2="410" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="45" y1="650" x2="705" y2="650" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="45" y1="830" x2="705" y2="830" stroke="#2148B8" stroke-width="1.2" stroke-opacity="0.85"/>
  
  <line x1="375" y1="45" x2="375" y2="830" stroke="#2148B8" stroke-width="0.6" stroke-dasharray="4,4" stroke-opacity="0.35"/>
  <line x1="265" y1="830" x2="265" y2="935" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.4"/>
  <line x1="485" y1="830" x2="485" y2="935" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Metric Calibrations along Right Edge -->
  <g class="font-mono" font-size="8" fill="#2148B8" opacity="0.6" text-anchor="end">
    <line x1="705" y1="180" x2="697" y2="180" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="183">100 mm</text>
    <line x1="705" y1="240" x2="697" y2="240" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="243">200 mm</text>
    <line x1="705" y1="300" x2="697" y2="300" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="303">300 mm</text>
    <line x1="705" y1="360" x2="697" y2="360" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="363">400 mm</text>
    <line x1="705" y1="420" x2="697" y2="420" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="423">500 mm</text>
    <line x1="705" y1="480" x2="697" y2="480" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="483">600 mm</text>
    <line x1="705" y1="540" x2="697" y2="540" stroke="#2148B8" stroke-width="0.8"/>
    <text x="692" y="543">700 mm</text>
  </g>

  <!-- ================= 3. HEADER DATA BAND ================= -->
  <g transform="translate(65, 75)">
    <text x="0" y="0" class="font-mono" font-size="11" font-weight="700" fill="#2148B8" letter-spacing="2">SERIES 01 / MECHANICS &amp; OSCILLATION</text>
    <text x="0" y="20" class="font-mono" font-size="9" fill="#2148B8" opacity="0.75" letter-spacing="1.2">SYSTEM SPECIFICATION: ISOCHRONISM OF PENDULUM</text>
  </g>

  <g transform="translate(685, 75)" text-anchor="end">
    <text x="0" y="0" class="font-sans" font-size="13" font-weight="800" fill="#C65F38" letter-spacing="2">高考物理知识库</text>
    <text x="0" y="20" class="font-mono" font-size="9" font-weight="600" fill="#2148B8" letter-spacing="1">YULAOSHIZUIKEAI'S PHYSICS NOTE</text>
  </g>

  <!-- ================= 4. VERTICAL LEFT METRIC STRIP ================= -->
  <g transform="translate(32, 600) rotate(-90)">
    <text x="0" y="0" class="font-mono" font-size="9.5" font-weight="600" fill="#2148B8" letter-spacing="2">
      EXP. 01 — GRAVITATIONAL VELOCITY / T = 2π√(L/g) / 9.80665 m/s²
    </text>
  </g>

  <!-- ================= 5. MANUAL GESTURE: TERRACOTTA REGISTRATION & TRAJECTORY ================= -->
  <!-- Target Calibrated Ring in Upper Half -->
  <g transform="translate(375, 290)">
    <circle cx="0" cy="0" r="76" fill="none" stroke="#C65F38" stroke-width="1.8" stroke-opacity="0.9"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#C65F38" stroke-width="0.6" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#C65F38" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2" fill="#C65F38"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#C65F38" stroke-width="0.8" stroke-dasharray="4,2"/>
    <line x1="0" y1="-90" x2="0" y2="90" stroke="#C65F38" stroke-width="0.8" stroke-dasharray="4,2"/>
    
    <text x="84" y="-8" class="font-mono" font-size="8.5" fill="#C65F38" font-weight="700">COORD: 0,0</text>
    <text x="84" y="5" class="font-mono" font-size="7.5" fill="#C65F38">DATUM AXIS</text>
  </g>

  <!-- Dynamic Trajectory Arc with Directional Arrow -->
  <path d="M 210 655 Q 375 745 540 685" fill="none" stroke="#C65F38" stroke-width="2.2" stroke-dasharray="8,4" marker-end="url(#arrow-terra)"/>
  
  <!-- Swept Area / Radial Angle Notation at Pivot -->
  <g transform="translate(375, 120)">
    <circle cx="0" cy="0" r="14" fill="#FAFAF7" stroke="#2148B8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#2148B8"/>
    <rect x="-8" y="-14" width="16" height="4" fill="#2148B8"/>
    
    <path d="M 0 0 L 0 90 A 90 90 0 0 1 29 85 Z" fill="#C65F38" fill-opacity="0.12"/>
    <path d="M 0 75 A 75 75 0 0 1 24 71" fill="none" stroke="#C65F38" stroke-width="1.5"/>
    <text x="8" y="65" class="font-mono" font-size="11" font-weight="700" fill="#C65F38">θ</text>
    <text x="35" y="80" class="font-mono" font-size="9" fill="#C65F38">θ = 18.5°</text>
  </g>

  <!-- ================= 6. MECHANICAL HERO: PENDULUM WITH STROBOSCOPIC HALFTONE ================= -->
  <!-- GHOST 1: Extreme Left Amplitude (θ = -24°) -->
  <g opacity="0.75">
    <line x1="375" y1="120" x2="215" y2="650" stroke="#2148B8" stroke-width="1" stroke-dasharray="2,3" stroke-opacity="0.45"/>
    <circle cx="215" cy="650" r="54" fill="url(#halftone-light)"/>
    <circle cx="215" cy="650" r="54" fill="none" stroke="#2148B8" stroke-width="0.8" stroke-opacity="0.35"/>
    <text x="180" y="720" class="font-mono" font-size="8" fill="#2148B8" opacity="0.6">t₀ = 0.00s</text>
  </g>

  <!-- GHOST 2: Intermediate Motion (θ = -12°) -->
  <g opacity="0.85">
    <line x1="375" y1="120" x2="288" y2="695" stroke="#2148B8" stroke-width="1.2" stroke-dasharray="3,3" stroke-opacity="0.55"/>
    <circle cx="288" cy="695" r="58" fill="url(#halftone-med)"/>
    <circle cx="288" cy="695" r="58" fill="none" stroke="#2148B8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="260" y="770" class="font-mono" font-size="8" fill="#2148B8" opacity="0.7">t₁ = 0.25 T</text>
  </g>

  <!-- GHOST 3: Equilibrium Nadir (θ = 0°) -->
  <g opacity="0.9">
    <line x1="375" y1="120" x2="375" y2="720" stroke="#2148B8" stroke-width="1.4" stroke-dasharray="4,2" stroke-opacity="0.65"/>
    <circle cx="375" cy="720" r="62" fill="url(#halftone-dense)"/>
    <circle cx="375" cy="720" r="62" fill="none" stroke="#2148B8" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="355" y1="720" x2="395" y2="720" stroke="#C65F38" stroke-width="1.2"/>
    <line x1="375" y1="700" x2="375" y2="740" stroke="#C65F38" stroke-width="1.2"/>
    <text x="382" y="745" class="font-mono" font-size="8.5" font-weight="700" fill="#C65F38">v_max</text>
  </g>

  <!-- ================= 7. TYPOGRAPHIC FOCAL EVENT ================= -->
  <!-- "THE ORDER OF MOTION" colliding directly with suspension wire & bob -->
  <g class="font-display" fill="#2148B8" letter-spacing="-2">
    <text x="65" y="475" font-size="96">THE ORDER</text>
    <text x="65" y="565" font-size="96">OF MOTION</text>
  </g>

  <!-- Subtitle and Chinese Editorial Definition -->
  <g transform="translate(68, 608)">
    <rect x="0" y="-16" width="6" height="22" fill="#C65F38"/>
    <text x="18" y="0" class="font-sans" font-size="18" font-weight="800" fill="#2148B8" letter-spacing="1">
      物 理 原 理 与 简 谐 运 动 秩 序
    </text>
    <text x="18" y="20" class="font-mono" font-size="10.5" font-weight="600" fill="#C65F38" letter-spacing="1.5">
      HARMONIC OSCILLATION · INVARIANCE OF GRAVITATION
    </text>
  </g>

  <!-- ================= 8. ACTIVE HERO BOB (FOREGROUND COLLISION) ================= -->
  <!-- Active Suspension Wire -->
  <line x1="375" y1="120" x2="528" y2="676" stroke="#2148B8" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Active Spherical Brass Bob at (528, 676) -->
  <g transform="translate(528, 676)">
    <!-- Suspension Collar / Eyebolt -->
    <rect x="-9" y="-76" width="18" height="12" rx="3" fill="#2148B8"/>
    <circle cx="0" cy="-76" r="6" fill="none" stroke="#2148B8" stroke-width="3"/>

    <!-- Main Solid Silhouette Sphere (Cobalt Plate) -->
    <circle cx="0" cy="0" r="70" fill="#2148B8"/>

    <!-- Mechanical Screen Texture Over Core Sphere -->
    <circle cx="0" cy="0" r="70" fill="url(#halftone-dense)" opacity="0.38"/>

    <!-- Specular Highlight Knockout (Exposed Paper Highlight) -->
    <ellipse cx="24" cy="-22" rx="28" ry="18" transform="rotate(35 24 -22)" fill="#FAFAF7"/>
    <ellipse cx="20" cy="-20" rx="15" ry="8" transform="rotate(35 20 -20)" fill="#FAFAF7"/>
    
    <!-- Secondary Bottom Rim Bounce-Light (Knockout) -->
    <path d="M -48 30 A 64 64 0 0 0 10 64 A 68 68 0 0 1 -48 30 Z" fill="#FAFAF7" opacity="0.9"/>

    <!-- Outer Precision Contour Rim -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#2148B8" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="73" fill="none" stroke="#2148B8" stroke-width="0.6" stroke-dasharray="3,3"/>

    <!-- Vector Arrows originating from Bob's Center of Mass -->
    <!-- Tension Force Vector F_T along suspension wire -->
    <line x1="0" y1="0" x2="-20" y2="-72" stroke="#C65F38" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
    <text x="-38" y="-52" class="font-mono" font-size="11" font-weight="700" fill="#C65F38">F_T</text>

    <!-- Gravity Vector mg (length 80px, stays safely above bottom frame) -->
    <line x1="0" y1="0" x2="0" y2="82" stroke="#C65F38" stroke-width="2.2" marker-end="url(#arrow-terra)"/>
    <text x="8" y="90" class="font-mono" font-size="11" font-weight="700" fill="#C65F38">m·g</text>

    <!-- Restoring Tangential Force F_res (length 55px) -->
    <line x1="0" y1="0" x2="-52" y2="14" stroke="#2148B8" stroke-width="2.2" marker-end="url(#arrow-cobalt)"/>
    <text x="-76" y="8" class="font-sans" font-size="10.5" font-weight="800" fill="#2148B8">F_回</text>

    <!-- Position Label -->
    <text x="85" y="5" class="font-mono" font-size="9" font-weight="700" fill="#2148B8">POS. AMPLITUDE</text>
    <text x="85" y="18" class="font-mono" font-size="8" fill="#C65F38">x = +A, v = 0</text>
  </g>

  <!-- ================= 9. SPECIMEN & FORMULA DATA CARDS ================= -->
  <!-- Card 1: Single Pendulum Period Formula -->
  <g transform="translate(65, 848)">
    <text x="0" y="0" class="font-mono" font-size="8.5" font-weight="700" fill="#C65F38" letter-spacing="1">LAW 01 · ISOCHRONISM</text>
    <text x="0" y="18" class="font-sans" font-size="13" font-weight="800" fill="#2148B8">单摆周期公式</text>
    
    <!-- Rendered Formula Box -->
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="180" height="34" fill="none" stroke="#2148B8" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="90" y="23" text-anchor="middle" class="font-serif" font-size="18" font-weight="bold" fill="#2148B8">
        T = 2π √(L / g)
      </text>
    </g>
    <text x="0" y="78" class="font-sans" font-size="9.5" fill="#2148B8" opacity="0.85">
      小角度(θ&lt;5°)振动周期与振幅无关
    </text>
  </g>

  <!-- Card 2: Restoring Force Mechanics -->
  <g transform="translate(285, 848)">
    <text x="0" y="0" class="font-mono" font-size="8.5" font-weight="700" fill="#C65F38" letter-spacing="1">LAW 02 · DYNAMICS</text>
    <text x="0" y="18" class="font-sans" font-size="13" font-weight="800" fill="#2148B8">简谐回复力方程</text>
    
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="180" height="34" fill="none" stroke="#2148B8" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="90" y="23" text-anchor="middle" class="font-serif" font-size="16" font-weight="bold" fill="#2148B8">
        F = - (mg/L) x
      </text>
    </g>
    <text x="0" y="78" class="font-sans" font-size="9.5" fill="#2148B8" opacity="0.85">
      重力切向分力提供系统回复加速度
    </text>
  </g>

  <!-- Card 3: Mechanical Energy Invariance -->
  <g transform="translate(505, 848)">
    <text x="0" y="0" class="font-mono" font-size="8.5" font-weight="700" fill="#C65F38" letter-spacing="1">LAW 03 · CONSERVATION</text>
    <text x="0" y="18" class="font-sans" font-size="13" font-weight="800" fill="#2148B8">机械能完全守恒</text>
    
    <g transform="translate(0, 28)">
      <rect x="0" y="0" width="180" height="34" fill="none" stroke="#2148B8" stroke-width="0.8" stroke-dasharray="2,2"/>
      <text x="90" y="23" text-anchor="middle" class="font-serif" font-size="16" font-weight="bold" fill="#2148B8">
        E = ½mv² + mgh = C
      </text>
    </g>
    <text x="0" y="78" class="font-sans" font-size="9.5" fill="#2148B8" opacity="0.85">
      势能与动能周期性无损耗转化
    </text>
  </g>

  <!-- ================= 10. BOTTOM METADATA BAR ================= -->
  <line x1="45" y1="935" x2="705" y2="935" stroke="#2148B8" stroke-width="0.6" stroke-opacity="0.4"/>

  <g transform="translate(65, 949)" class="font-mono" font-size="8.5" fill="#2148B8" opacity="0.85">
    <text x="0" y="0">MONO-COLOR EDITORIAL POSTER · TWO-INK PROCESS (COBALT #2148B8 + TERRACOTTA #C65F38)</text>
  </g>

  <g transform="translate(685, 949)" text-anchor="end" class="font-mono" font-size="8.5" font-weight="700" fill="#C65F38">
    <text x="0" y="0">EDITION 2026 / YULAOSHIZUIKEAI</text>
  </g>

</svg>
